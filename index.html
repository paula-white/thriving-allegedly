<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thriving, allegedly</title>
<meta name="description" content="Your daily dose of questionable optimism. Coming soon.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Thriving, allegedly">
<meta property="og:description" content="Coming soon.">
<meta name="theme-color" content="#2D2E2C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  /* The app's opening screen: roaming lava on charcoal, the warped wordmark,
     and a line at the bottom. */
  :root {
    --charcoal: #2D2E2C;
    --yellow: #F4FF3D;
    --serif: "Instrument Serif", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--charcoal); color-scheme: dark; }
  body { overflow: hidden; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* The app's scrolling tagline: one line drifting right to left on a loop. */
  .soon {
    position: fixed; left: 0; right: 0;
    bottom: max(28px, calc(env(safe-area-inset-bottom, 0px) + 16px));
    margin: 0; overflow: hidden; white-space: nowrap;
    font-family: var(--serif); font-style: italic; text-transform: uppercase;
    font-size: clamp(30px, 9.6vw, 42px); line-height: 1.7; color: var(--yellow);
    text-shadow: 0 0 10px rgba(45, 46, 44, 0.55), 0 0 4px rgba(45, 46, 44, 0.35);
  }
  .track { display: inline-block; will-change: transform; animation: drift var(--duration, 6s) linear infinite; }
  .unit { display: inline-block; padding-right: 0.3em; }
  /* The asterisk sits high in the font, so lower it to the middle of the capitals. */
  .star { position: relative; top: 0.2em; }
  @keyframes drift { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(calc(-1 * var(--unit, 0px)), 0, 0); } }
  @media (prefers-reduced-motion: reduce) {
    .soon { text-align: center; }
    .track { animation: none; }
  }
</style>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>
<h1>Thriving, allegedly</h1>
<p class="soon" aria-label="Coming soon"><span class="track" id="track" aria-hidden="true"></span></p>

<script>
// Enough copies of "COMING SOON *" to fill the width, sliding left by exactly
// one copy at 72 px a second, so the loop is seamless.
(function tagline() {
  const track = document.getElementById("track");
  const unit = '<span class="unit">COMING SOON <span class="star">*</span></span>';
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { track.textContent = "COMING SOON"; return; }
  let builtFor = 0;
  function build() {
    // Phones fire resize when the address bar shows or hides; only rebuild
    // when the width really changes, so the drift never restarts mid-scroll.
    if (innerWidth === builtFor) return;
    builtFor = innerWidth;
    track.innerHTML = unit + unit;
    const [a, b] = track.children;
    // The exact distance from one copy to the next, so the loop lands on itself.
    const step = b.getBoundingClientRect().left - a.getBoundingClientRect().left;
    const copies = Math.ceil(innerWidth / Math.max(step, 1)) + 2;
    track.innerHTML = unit.repeat(copies);
    track.style.setProperty("--unit", `${step}px`);
    track.style.setProperty("--duration", `${step / 72}s`);
  }
  document.fonts.ready.then(build);
  addEventListener("resize", build);
})();

// Ported from the app's LavaLamp.metal: posterLava for the background and
// wordmarkWarp bending the wordmark as one sheet, on the same clock.
(function () {
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const canvas = document.getElementById("stage");
  const gl = canvas.getContext("webgl", { antialias: false });
  if (!gl) return;

  const vert = "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";
  const frag = `
    precision highp float;
    uniform float time;
    uniform vec2 size;
    uniform sampler2D word;
    uniform vec4 sheet; // x, y, width, height in pixels, top-left origin
    const vec3 base = vec3(0.176, 0.180, 0.173);
    const vec3 lime = vec3(0.875, 1.0, 0.0);
    const vec3 yellow = vec3(0.957, 1.0, 0.239);
    const float PI = 3.14159265;

    float grain(vec2 q){ return fract(sin(dot(q, vec2(12.9898, 78.233))) * 43758.5453); }
    vec2 warp(vec2 q, float t){
      vec2 w = q;
      w.x += 0.18 * sin(q.y * 2.3 + t * 0.28);
      w.y += 0.15 * sin(q.x * 1.9 - t * 0.23 + 0.7);
      w.x += 0.07 * sin(q.y * 4.8 + q.x * 1.6 + t * 0.41);
      w.y += 0.055 * sin(q.x * 3.6 - q.y * 2.2 - t * 0.19);
      return w;
    }
    float bloom(vec2 q, vec2 c, vec2 r){ vec2 d = (q - c) / max(r, vec2(0.045)); return exp(-dot(d, d) * 1.7); }
    // extent is the screen measured in its shorter side, so blobs keep the app's
    // size on a wide screen instead of swamping it.
    vec2 roam(float t, vec2 extent, float sx, float sy, float px, float py){
      return extent * vec2(0.5 + 0.48 * sin(t * sx + px), 0.5 + 0.46 * sin(t * sy + py));
    }

    vec3 lava(vec2 pos, float t){
      float side = min(size.x, size.y);
      vec2 aspect = size / side;
      vec2 q = warp(pos / side, t);
      // Smaller blobs on a wide screen leave more charcoal showing.
      float breathe = (1.0 + 0.18 * sin(t * 0.55)) * (size.x > size.y ? 0.8 : 1.0);
      float a = bloom(q, roam(t, aspect, 0.34, 0.21, 0.0, 1.9), vec2(0.42, 0.48) * breathe)
              + bloom(q, roam(t, aspect, 0.27, 0.31, 2.6, 4.4), vec2(0.36, 0.42) * breathe)
              + bloom(q, roam(t, aspect, 0.39, 0.24, 3.7, 0.9), vec2(0.28, 0.34) * breathe);
      float b = bloom(q, roam(t, aspect, 0.23, 0.26, 4.1, 0.2), vec2(0.46, 0.40) * breathe)
              + bloom(q, roam(t, aspect, 0.37, 0.18, 1.2, 3.1), vec2(0.32, 0.38) * breathe)
              + bloom(q, roam(t, aspect, 0.29, 0.35, 5.0, 2.5), vec2(0.26, 0.30) * breathe);
      float c = bloom(q, roam(t, aspect, 0.31, 0.25, 5.3, 5.6), vec2(0.32, 0.34) * breathe)
              + bloom(q, roam(t, aspect, 0.42, 0.29, 0.6, 3.8), vec2(0.28, 0.30) * breathe);
      float total = a + b + c;
      float shape = smoothstep(0.12, 1.0, total);
      vec3 blob = (lime * a + yellow * b + yellow * c) / max(total, 0.0001);
      return mix(base, blob, shape);
    }

    // Where in the flat wordmark this pixel of the bent sheet comes from.
    vec2 wordmarkWarp(vec2 p, float t, vec2 s){
      float nx = clamp(p.x / s.x, 0.0, 1.0);
      float ny = clamp(p.y / s.y, 0.0, 1.0);
      float breath = sin(t * 0.42 + 0.55);
      float along = nx + 0.08 * sin(t * 0.31);
      float amplitude = s.y * (0.058 + 0.016 * breath);
      float curve = max(sin(along * PI), 0.0) * amplitude;
      float slope = cos(along * PI) * amplitude * PI / s.x;
      float widthPulse = 0.08 * breath + 0.04 * sin(nx * PI + t * 0.37);
      float heightPulse = -0.07 * breath + 0.05 * sin(nx * 2.0 * PI + t * 0.51);
      float midY = s.y * 0.5;
      float fromMid = p.y - midY;
      float sx = s.x * (0.5 + (nx - 0.5) * (1.0 - widthPulse));
      sx += fromMid * slope * 0.28;
      sx += sin(ny * 6.5 + t * 0.46) * s.x * 0.007;
      float sy = midY + fromMid * (1.0 - heightPulse) + curve;
      sy += sin(nx * 7.5 + t * 0.64) * s.y * 0.018;
      return vec2(sx, sy);
    }

    void main(){
      vec2 pos = vec2(gl_FragCoord.x, size.y - gl_FragCoord.y);
      // The lava starts from the app's moulded-together moment.
      vec3 col = lava(pos, time + 14.0);
      col += (grain(floor(pos * 1.35)) - 0.5) * 0.028;
      col = clamp(col, 0.0, 1.0);

      vec2 local = pos - sheet.xy;
      if (all(greaterThanEqual(local, vec2(0.0))) && all(lessThan(local, sheet.zw))) {
        vec2 uv = wordmarkWarp(local, time, sheet.zw) / sheet.zw;
        if (all(greaterThanEqual(uv, vec2(0.0))) && all(lessThanEqual(uv, vec2(1.0)))) {
          vec4 w = texture2D(word, uv); // premultiplied
          col = col * (1.0 - w.a) + w.rgb;
        }
      }
      gl_FragColor = vec4(col, 1.0);
    }`;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vert));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, "time");
  const uSize = gl.getUniformLocation(prog, "size");
  const uSheet = gl.getUniformLocation(prog, "sheet");

  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));
  gl.uniform1i(gl.getUniformLocation(prog, "word"), 0);

  // The lockup as in KineticWordmark: two stacked lines of Anton, pulled
  // together, with padding around it so the sheet has room to bend.
  const font = size => `400 ${size}px Anton, Impact, "Arial Narrow", sans-serif`;
  function drawWordmark(dpr) {
    const vw = innerWidth, vh = innerHeight;
    const target = Math.min(vw * 0.48, vh * 0.63, 550) * dpr;
    const ctx = document.createElement("canvas").getContext("2d");
    ctx.font = font(100);
    if ("letterSpacing" in ctx) ctx.letterSpacing = "-3px";
    const per100 = ctx.measureText("ALLEGEDLY").width;
    const size = 100 * target / per100;

    ctx.font = font(size);
    const m = ctx.measureText("ALLEGEDLY");
    const ascent = m.fontBoundingBoxAscent ?? size * 1.2;
    const descent = m.fontBoundingBoxDescent ?? size * 0.3;
    const pitch = ascent + descent - size * 0.30;
    const padX = size * 0.32, padY = size * 0.96;
    const width = Math.ceil(target + padX * 2 + size * 0.8);
    const height = Math.ceil(ascent + descent + pitch + padY * 2);

    const c = ctx.canvas;
    c.width = width;
    c.height = height;
    ctx.font = font(size);
    if ("letterSpacing" in ctx) ctx.letterSpacing = `${-size * 0.03}px`;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#FFF9EB";
    // A soft charcoal glow keeps the words clear wherever a blob drifts.
    ctx.shadowColor = "rgba(45, 46, 44, 0.55)";
    ctx.shadowBlur = size * 0.25;
    const top = padY + ascent;
    ctx.fillText("THRIVING,", width / 2, top);
    ctx.fillText("ALLEGEDLY", width / 2, top + pitch);
    // ™, small and level with the tops of the capitals, just past the Y.
    const caps = m.actualBoundingBoxAscent ?? size * 0.75;
    ctx.font = font(size * 0.22);
    if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillText("™", width / 2 + m.width / 2 + size * 0.06, top + pitch - caps * 0.97);

    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);

    // Centred a little above the middle, leaving the bottom for the line.
    const x = (canvas.width - width) / 2;
    const y = (canvas.height - height) / 2 - canvas.height * 0.04;
    gl.uniform4f(uSheet, x, y, width, height);
  }

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uSize, canvas.width, canvas.height);
    drawWordmark(dpr);
  }

  // A posed still under Reduce Motion, with the arch already in frame.
  const restingTime = 2.2;
  let start = performance.now();
  function draw(now) {
    gl.uniform1f(uTime, reduceMotion ? restingTime : (now - start) / 1000);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!reduceMotion) requestAnimationFrame(draw);
  }

  document.fonts.load(font(100)).finally(() => {
    resize();
    addEventListener("resize", () => { resize(); if (reduceMotion) draw(0); });
    start = performance.now();
    requestAnimationFrame(draw);
  });
})();
</script>
</body>
</html>
